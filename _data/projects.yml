# Thumbnails are 480x360 (4:3) and live in assets/img/thumbs/.
- title: PAVAC, privacy-aware perception on a rover
  description: Real-time face anonymization on a Jetson Orin Nano using SCRFD and TensorRT, built into a physical rover stack. Mosaic and noise-based anonymization cut compute by over 92%, with about 41 ms end-to-end latency.
  tech: PyTorch, ONNX, TensorRT, Jetson
  image: /assets/img/thumbs/pavac.jpg
  links:
    video: /demos/pavac/
    code: https://github.com/charleysanchez/AVPrivacy-Jetson
    report: /assets/docs/AVPrivacy_report.pdf

- title: Audit-aware RAG on AWS Bedrock
  description: A retrieval-augmented generation pipeline using Titan embeddings and Claude, with strict JSON outputs, a human review gate, and JSONL audit logs with trace IDs.
  tech: Python, AWS Bedrock, LangChain, Streamlit
  image: /assets/img/thumbs/audit_rag.jpg
  links:
    video: /demos/audit-rag/
    code: https://github.com/charleysanchez/aws-claude-rag

- title: sEMG keystroke recognition
  description: A bidirectional LSTM with residual connections for decoding typing from wrist sEMG on EMG2QWERTY (346 hours, 108 users). Cut character error rate by 12% over the baseline.
  tech: PyTorch, signal processing
  image: /assets/img/thumbs/semg.jpg
  links:
    code: https://github.com/charleysanchez/SOTA-4
    report: /assets/docs/SEmg_report.pdf

- title: Spurious features in pretrained encoders
  description: Used DecompX to measure how much BERT and RoBERTa rely on spurious tokens, and evaluated counterfactual augmentation and sequence-length limits for robustness.
  tech: Python, BERT, RoBERTa
  image: /assets/img/thumbs/spurious.jpg
  links:
    code: https://github.com/metehanberker1/pretrained-encoders-spurious-learning-analysis
    report: /assets/docs/spurious_report.pdf

- title: Brain tumor segmentation (BraTS 2020)
  description: Segmenting tumor core, edema, and enhancing tumor from T1, T1Gd, T2, and FLAIR MRI.
  tech: Python, deep learning, medical imaging
  image: /assets/img/thumbs/brain_seg.jpg
  links:
    code: https://github.com/charleysanchez/brain_tumor_segmentation

- title: GeoBot, image geolocation
  description: A training pipeline for predicting where a photo was taken, with a Haversine loss, YAML configs, W&B tracking, and a Gradio demo.
  tech: PyTorch, W&B, Gradio
  image: /assets/img/thumbs/geobot.jpg
